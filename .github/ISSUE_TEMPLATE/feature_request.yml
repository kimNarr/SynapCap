name: 기능 제안
description: 새로운 기능이나 개선 아이디어를 제안해 주세요.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: 필요한 기능
      description: 어떤 기능이 필요하며 현재 무엇이 불편한가요?
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: 사용 사례
      description: 이 기능을 언제, 어떻게 사용할지 알려주세요.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 원하는 동작이나 UI
      description: 생각한 방식이 있다면 적어주세요. 이미지도 첨부할 수 있습니다.
  - type: dropdown
    id: platform
    attributes:
      label: 주로 사용하는 운영체제
      options:
        - Windows
        - macOS
        - 둘 다
